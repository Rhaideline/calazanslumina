<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#be185d"/>
      <stop offset="100%" style="stop-color:#4c0519"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f9a8d4"/>
      <stop offset="100%" style="stop-color:#fbcfe8"/>
    </linearGradient>
    <linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Decorative -->
  <circle cx="680" cy="90" r="140" fill="#ffffff" opacity="0.03"/>
  <circle cx="700" cy="400" r="100" fill="#ffffff" opacity="0.03"/>
  <!-- Instagram icon -->
  <g transform="translate(580, 80)">
    <rect x="0" y="0" width="120" height="120" rx="30" fill="none" stroke="url(#ig)" stroke-width="3" opacity="0.5"/>
    <circle cx="60" cy="60" r="30" fill="none" stroke="#f9a8d4" stroke-width="2.5" opacity="0.5"/>
    <circle cx="92" cy="28" r="7" fill="#f9a8d4" opacity="0.4"/>
  </g>
  <!-- Heart notification -->
  <g transform="translate(620, 220)" opacity="0.5">
    <rect x="0" y="0" width="80" height="35" rx="17" fill="#ffffff" opacity="0.15"/>
    <path d="M22 12 C22 8 15 8 15 14 C15 18 22 24 22 24 C22 24 29 18 29 14 C29 8 22 8 22 12Z" fill="#ec4899" opacity="0.8"/>
    <text x="42" y="22" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" opacity="0.8">2.4K</text>
  </g>
  <!-- Comment bubbles -->
  <g transform="translate(570, 280)" opacity="0.3">
    <rect x="0" y="0" width="100" height="30" rx="15" fill="#f9a8d4"/>
    <rect x="40" y="40" width="120" height="30" rx="15" fill="#f9a8d4" opacity="0.6"/>
    <rect x="20" y="80" width="90" height="30" rx="15" fill="#f9a8d4" opacity="0.4"/>
  </g>
  <!-- Dollar signs -->
  <g transform="translate(720, 320)" opacity="0.25">
    <text font-family="Georgia,serif" font-size="40" fill="#fbbf24">$</text>
    <text y="40" font-family="Georgia,serif" font-size="30" fill="#fbbf24" opacity="0.6">$</text>
  </g>
  <!-- Badge -->
  <rect x="50" y="30" width="100" height="36" rx="18" fill="#ec4899"/>
  <text x="100" y="54" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">R$20</text>
  <!-- Title -->
  <text x="50" y="155" font-family="Georgia,serif" font-size="40" font-weight="bold" fill="#ffffff">Redes Sociais</text>
  <text x="50" y="205" font-family="Georgia,serif" font-size="40" font-weight="bold" fill="#fbcfe8">que Vendem</text>
  <!-- Divider -->
  <rect x="50" y="225" width="80" height="4" rx="2" fill="url(#accent)"/>
  <!-- Subtitle -->
  <text x="50" y="265" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.7">Conteudo que converte</text>
  <text x="50" y="290" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.7">seguidores em clientes.</text>
  <text x="50" y="315" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.7">Instagram, TikTok e mais.</text>
  <!-- Stats -->
  <text x="50" y="365" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#f9a8d4" font-weight="bold">5 modulos  ·  30 aulas  ·  Templates inclusos</text>
  <!-- Footer -->
  <rect x="0" y="440" width="800" height="60" fill="#000000" opacity="0.3"/>
  <text x="50" y="478" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" opacity="0.6" letter-spacing="3">CALAZANS LUMINA</text>
</svg>