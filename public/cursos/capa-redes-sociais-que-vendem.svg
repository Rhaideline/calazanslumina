<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- Background: ink -->
  <rect width="800" height="500" fill="#1A0E0B"/>
  <!-- Right side: huge 10x typographic -->
  <text x="780" y="370" font-family="Georgia, 'DM Serif Display', serif" font-size="360" font-weight="700" fill="#F1EAE0" text-anchor="end" opacity="0.95">10</text>
  <text x="780" y="370" font-family="Georgia, 'DM Serif Display', serif" font-size="160" font-style="italic" font-weight="400" fill="#FF0005" text-anchor="end">x</text>
  <!-- Small label above 10x -->
  <text x="780" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#F1EAE0" text-anchor="end" letter-spacing="4" opacity="0.5">SEU ALCANCE</text>
  <!-- Badge GRÁTIS -->
  <rect x="40" y="28" width="120" height="38" rx="2" fill="#16a34a"/>
  <text x="100" y="53" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">GRÁTIS</text>
  <!-- Title -->
  <text x="50" y="170" font-family="Georgia, 'DM Serif Display', serif" font-size="62" font-weight="700" fill="#F1EAE0">Redes sociais</text>
  <text x="50" y="232" font-family="Georgia, 'DM Serif Display', serif" font-size="62" font-style="italic" font-weight="400" fill="#FF0005">que vendem.</text>
  <!-- Subtitle -->
  <text x="50" y="282" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#F1EAE0" opacity="0.65">Conteúdo que atrai, conecta</text>
  <text x="50" y="308" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#F1EAE0" opacity="0.65">e converte — sem gurus.</text>
  <!-- Stats -->
  <text x="50" y="430" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#F1EAE0" letter-spacing="1" opacity="0.85">6 módulos · 26 aulas · Templates de post</text>
  <!-- Brand mark -->
  <text x="750" y="475" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#F1EAE0" text-anchor="end" letter-spacing="3" opacity="0.5">CALAZANS LUMINA</text>
</svg>
