<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#451a03"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Decorative -->
  <circle cx="680" cy="100" r="140" fill="#ffffff" opacity="0.03"/>
  <!-- Funnel icon -->
  <g transform="translate(560, 70)">
    <!-- Funnel shape -->
    <path d="M20 20 L200 20 L160 120 L130 220 L130 280 L90 280 L90 220 L60 120Z" fill="#fbbf24" opacity="0.12"/>
    <path d="M30 30 L190 30 L155 115 L125 210 L125 270 L95 270 L95 210 L65 115Z" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
    <!-- Dots flowing through funnel -->
    <circle cx="60" cy="50" r="6" fill="#fde68a" opacity="0.6"/>
    <circle cx="100" cy="45" r="6" fill="#fde68a" opacity="0.5"/>
    <circle cx="140" cy="50" r="6" fill="#fde68a" opacity="0.6"/>
    <circle cx="170" cy="42" r="6" fill="#fde68a" opacity="0.4"/>
    <circle cx="80" cy="55" r="5" fill="#fde68a" opacity="0.3"/>
    <!-- Mid funnel -->
    <circle cx="100" cy="100" r="5" fill="#fbbf24" opacity="0.5"/>
    <circle cx="120" cy="95" r="5" fill="#fbbf24" opacity="0.4"/>
    <!-- Bottom - money -->
    <circle cx="110" cy="260" r="12" fill="#fbbf24" opacity="0.6"/>
    <text x="110" y="265" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#451a03" text-anchor="middle">$</text>
    <!-- Arrow down -->
    <path d="M105 290 L110 305 L115 290" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>
  </g>
  <!-- Small conversion arrows -->
  <g transform="translate(600, 370)" opacity="0.25">
    <path d="M0 0 L40 0 L35 -8 M40 0 L35 8" fill="none" stroke="#fde68a" stroke-width="2"/>
    <text x="50" y="5" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#fde68a">Lead</text>
    <path d="M90 0 L130 0 L125 -8 M130 0 L125 8" fill="none" stroke="#fde68a" stroke-width="2"/>
    <text x="140" y="5" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#fde68a">Venda</text>
  </g>
  <!-- Badge -->
  <rect x="50" y="30" width="100" height="36" rx="18" fill="#f59e0b"/>
  <text x="100" y="54" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">R$20</text>
  <!-- Title -->
  <text x="50" y="155" font-family="Georgia,serif" font-size="40" font-weight="bold" fill="#ffffff">Funis de</text>
  <text x="50" y="205" font-family="Georgia,serif" font-size="40" font-weight="bold" fill="#ffffff">Vendas</text>
  <text x="50" y="248" font-family="Georgia,serif" font-size="30" font-weight="bold" fill="#fde68a">Simplificado</text>
  <!-- Divider -->
  <rect x="50" y="265" width="80" height="4" rx="2" fill="url(#accent)"/>
  <!-- Subtitle -->
  <text x="50" y="305" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.7">Crie funis que convertem</text>
  <text x="50" y="330" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.7">visitantes em clientes.</text>
  <text x="50" y="355" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.7">Landing pages + automacao.</text>
  <!-- Stats -->
  <text x="50" y="398" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#fbbf24" font-weight="bold">5 modulos  ·  25 aulas  ·  Templates GHL</text>
  <!-- Footer -->
  <rect x="0" y="440" width="800" height="60" fill="#000000" opacity="0.3"/>
  <text x="50" y="478" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" opacity="0.6" letter-spacing="3">CALAZANS LUMINA</text>
</svg>