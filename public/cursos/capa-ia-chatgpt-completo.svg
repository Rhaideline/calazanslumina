<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81"/>
      <stop offset="50%" style="stop-color:#4c1d95"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="45%" r="35%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <!-- Neural network pattern -->
  <g opacity="0.07" stroke="#a78bfa" stroke-width="1" fill="none">
    <circle cx="580" cy="80" r="6"/><circle cx="650" cy="50" r="6"/><circle cx="720" cy="90" r="6"/>
    <circle cx="550" cy="150" r="6"/><circle cx="630" cy="170" r="6"/><circle cx="740" cy="140" r="6"/>
    <circle cx="600" cy="230" r="6"/><circle cx="700" cy="210" r="6"/>
    <line x1="580" y1="80" x2="650" y2="50"/><line x1="650" y1="50" x2="720" y2="90"/>
    <line x1="580" y1="80" x2="550" y2="150"/><line x1="580" y1="80" x2="630" y2="170"/>
    <line x1="720" y1="90" x2="740" y2="140"/><line x1="630" y1="170" x2="700" y2="210"/>
    <line x1="550" y1="150" x2="600" y2="230"/><line x1="700" y1="210" x2="740" y2="140"/>
  </g>
  <!-- AI Brain icon (right side, large, semi-transparent) -->
  <g transform="translate(550, 140)" opacity="0.16">
    <circle cx="100" cy="100" r="95" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <circle cx="100" cy="100" r="70" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 4"/>
    <!-- Brain paths -->
    <path d="M70 100 Q70 55 100 55 Q130 55 130 85 Q145 65 125 48 Q100 30 80 48" fill="none" stroke="#c4b5fd" stroke-width="3.5"/>
    <path d="M70 100 Q70 145 100 145 Q130 145 130 115 Q145 135 125 152 Q100 170 80 152" fill="none" stroke="#c4b5fd" stroke-width="3.5"/>
    <line x1="100" y1="55" x2="100" y2="145" stroke="#c4b5fd" stroke-width="2" opacity="0.5"/>
    <!-- Circuit dots -->
    <circle cx="100" cy="55" r="4" fill="#a78bfa"/>
    <circle cx="100" cy="145" r="4" fill="#a78bfa"/>
    <circle cx="70" cy="100" r="4" fill="#a78bfa"/>
    <circle cx="130" cy="100" r="4" fill="#a78bfa"/>
  </g>
  <!-- Sparkles -->
  <g opacity="0.5">
    <g transform="translate(710, 110)">
      <line x1="8" y1="0" x2="8" y2="16" stroke="#e9d5ff" stroke-width="2"/>
      <line x1="0" y1="8" x2="16" y2="8" stroke="#e9d5ff" stroke-width="2"/>
    </g>
    <g transform="translate(540, 320)">
      <line x1="6" y1="0" x2="6" y2="12" stroke="#e9d5ff" stroke-width="1.5"/>
      <line x1="0" y1="6" x2="12" y2="6" stroke="#e9d5ff" stroke-width="1.5"/>
    </g>
    <g transform="translate(750, 300)">
      <line x1="5" y1="0" x2="5" y2="10" stroke="#e9d5ff" stroke-width="1.5"/>
      <line x1="0" y1="5" x2="10" y2="5" stroke="#e9d5ff" stroke-width="1.5"/>
    </g>
  </g>
  <!-- Badge -->
  <rect x="40" y="28" width="100" height="40" rx="20" fill="#a78bfa"/>
  <text x="90" y="54" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">R$20</text>
  <!-- Title -->
  <text x="50" y="155" font-family="Georgia,serif" font-size="48" font-weight="bold" fill="#ffffff">IA &amp; ChatGPT</text>
  <text x="50" y="210" font-family="Georgia,serif" font-size="42" font-weight="bold" fill="#c4b5fd">Curso Completo</text>
  <!-- Divider -->
  <rect x="50" y="230" width="90" height="4" rx="2" fill="url(#accent)"/>
  <!-- Subtitle -->
  <text x="50" y="270" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.75">Do zero ao avançado.</text>
  <text x="50" y="295" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.75">Crie conteúdo, automatize</text>
  <text x="50" y="320" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.75">tarefas e venda mais com IA.</text>
  <!-- Stats -->
  <text x="50" y="370" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#a78bfa" font-weight="bold">8 módulos  ·  45 aulas  ·  Certificado</text>
  <!-- Footer -->
  <rect x="0" y="440" width="800" height="60" fill="#000000" opacity="0.25"/>
  <text x="50" y="478" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#ffffff" opacity="0.45" letter-spacing="3">CALAZANS LUMINA</text>
</svg>