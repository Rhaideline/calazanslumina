<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ink-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A0E0B"/>
      <stop offset="100%" stop-color="#0d0706"/>
    </linearGradient>
  </defs>
  <!-- Background: ink -->
  <rect width="800" height="600" fill="url(#ink-grad)"/>

  <!-- Big price number centered, safe from cropping -->
  <g transform="translate(400 360)">
    <text x="0" y="0" font-family="Georgia, 'DM Serif Display', serif" font-size="190" font-weight="700" fill="#F1EAE0" text-anchor="middle" opacity="0.95">9,90</text>
    <!-- Subtle red underline accent under the number -->
    <rect x="-180" y="20" width="360" height="6" fill="#FF0005"/>
    <text x="0" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#F1EAE0" text-anchor="middle" letter-spacing="6" opacity="0.55">REAIS · LANCAMENTO</text>
  </g>

  <!-- Badge top-left: R$ 9,90 -->
  <rect x="40" y="32" width="130" height="40" rx="3" fill="#FF0005"/>
  <text x="105" y="58" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0d0706" text-anchor="middle" letter-spacing="2">R$ 9,90</text>

  <!-- Title block -->
  <text x="50" y="160" font-family="Georgia, 'DM Serif Display', serif" font-size="60" font-weight="700" fill="#F1EAE0">IA &amp; ChatGPT</text>
  <text x="50" y="220" font-family="Georgia, 'DM Serif Display', serif" font-size="54" font-style="italic" font-weight="400" fill="#FF0005">curso completo.</text>

  <!-- Subtitle -->
  <text x="50" y="265" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#F1EAE0" opacity="0.65">Do zero ao avançado — crie, automatize</text>
  <text x="50" y="290" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#F1EAE0" opacity="0.65">e venda mais com inteligência artificial.</text>

  <!-- Footer stats -->
  <text x="400" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#F1EAE0" letter-spacing="2" opacity="0.85" text-anchor="middle">95 PÁGINAS · 10 IAS · 50 PROMPTS · CERTIFICADO</text>

  <!-- Brand mark bottom right -->
  <text x="400" y="572" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#F1EAE0" text-anchor="middle" letter-spacing="4" opacity="0.4">CALAZANS LUMINA</text>
</svg>
