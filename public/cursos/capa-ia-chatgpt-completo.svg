<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="ink-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A0E0B"/>
      <stop offset="100%" stop-color="#0d0706"/>
    </linearGradient>
  </defs>
  <!-- Background: ink -->
  <rect width="800" height="500" fill="url(#ink-grad)"/>
  <!-- Right side visual: gigantic "10" cream -->
  <text x="780" y="370" font-family="Georgia, 'DM Serif Display', serif" font-size="380" font-weight="700" fill="#F1EAE0" text-anchor="end" opacity="0.95">10</text>
  <!-- Subtle red underline accent on the 10 -->
  <rect x="555" y="378" width="200" height="5" fill="#FF0005"/>
  <!-- Badge R$ 10 -->
  <rect x="40" y="28" width="110" height="38" rx="2" fill="#FF0005"/>
  <text x="95" y="53" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0d0706" text-anchor="middle" letter-spacing="2">R$ 10</text>
  <!-- Title -->
  <text x="50" y="170" font-family="Georgia, 'DM Serif Display', serif" font-size="62" font-weight="700" fill="#F1EAE0">IA &amp; ChatGPT</text>
  <text x="50" y="232" font-family="Georgia, 'DM Serif Display', serif" font-size="58" font-style="italic" font-weight="400" fill="#FF0005">curso completo.</text>
  <!-- Subtitle -->
  <text x="50" y="282" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#F1EAE0" opacity="0.65">Do zero ao avançado — crie,</text>
  <text x="50" y="308" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#F1EAE0" opacity="0.65">automatize e venda mais com IA.</text>
  <!-- Stats -->
  <text x="50" y="430" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#F1EAE0" letter-spacing="1" opacity="0.85">8 módulos · 45 aulas · Certificado incluso</text>
  <!-- Brand mark -->
  <text x="750" y="475" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#F1EAE0" text-anchor="end" letter-spacing="3" opacity="0.5">CALAZANS LUMINA</text>
</svg>
