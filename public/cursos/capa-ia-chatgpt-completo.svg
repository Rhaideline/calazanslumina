<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c1d95"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Neural network pattern -->
  <g opacity="0.08" stroke="#a78bfa" stroke-width="1" fill="none">
    <circle cx="600" cy="100" r="8"/><circle cx="680" cy="60" r="8"/><circle cx="720" cy="150" r="8"/>
    <circle cx="550" cy="180" r="8"/><circle cx="650" cy="200" r="8"/><circle cx="750" cy="120" r="8"/>
    <line x1="600" y1="100" x2="680" y2="60"/><line x1="680" y1="60" x2="720" y2="150"/>
    <line x1="600" y1="100" x2="550" y2="180"/><line x1="600" y1="100" x2="650" y2="200"/>
    <line x1="720" y1="150" x2="750" y2="120"/><line x1="650" y1="200" x2="720" y2="150"/>
    <line x1="550" y1="180" x2="650" y2="200"/>
  </g>
  <!-- Brain/AI icon -->
  <g transform="translate(560, 160)">
    <circle cx="90" cy="90" r="85" fill="#a78bfa" opacity="0.12"/>
    <circle cx="90" cy="90" r="60" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.4"/>
    <!-- Brain paths -->
    <path d="M60 90 Q60 50 90 50 Q120 50 120 80 Q130 60 110 45 Q90 30 70 45" fill="none" stroke="#c4b5fd" stroke-width="2.5" opacity="0.7"/>
    <path d="M60 90 Q60 130 90 130 Q120 130 120 100 Q130 120 110 135 Q90 150 70 135" fill="none" stroke="#c4b5fd" stroke-width="2.5" opacity="0.7"/>
    <line x1="90" y1="50" x2="90" y2="130" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4"/>
    <!-- Sparkle -->
    <g transform="translate(140, 30)" opacity="0.6">
      <line x1="10" y1="0" x2="10" y2="20" stroke="#e9d5ff" stroke-width="2"/>
      <line x1="0" y1="10" x2="20" y2="10" stroke="#e9d5ff" stroke-width="2"/>
    </g>
    <g transform="translate(20, 150)" opacity="0.4">
      <line x1="8" y1="0" x2="8" y2="16" stroke="#e9d5ff" stroke-width="2"/>
      <line x1="0" y1="8" x2="16" y2="8" stroke="#e9d5ff" stroke-width="2"/>
    </g>
  </g>
  <!-- Badge -->
  <rect x="50" y="30" width="100" height="36" rx="18" fill="#a78bfa"/>
  <text x="100" y="54" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">R$20</text>
  <!-- Title -->
  <text x="50" y="155" font-family="Georgia,serif" font-size="44" font-weight="bold" fill="#ffffff">IA &amp; ChatGPT</text>
  <text x="50" y="205" font-family="Georgia,serif" font-size="38" font-weight="bold" fill="#c4b5fd">Curso Completo</text>
  <!-- Divider -->
  <rect x="50" y="225" width="80" height="4" rx="2" fill="url(#accent)"/>
  <!-- Subtitle -->
  <text x="50" y="265" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#ffffff" opacity="0.7">Do zero ao avancado.</text>
  <text x="50" y="290" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#ffffff" opacity="0.7">Crie conteudo, automatize</text>
  <text x="50" y="315" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#ffffff" opacity="0.7">tarefas e venda mais com IA.</text>
  <!-- Stats -->
  <text x="50" y="365" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#a78bfa" font-weight="bold">8 modulos  ·  45 aulas  ·  Certificado</text>
  <!-- Footer -->
  <rect x="0" y="440" width="800" height="60" fill="#000000" opacity="0.3"/>
  <text x="50" y="478" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" opacity="0.6" letter-spacing="3">CALAZANS LUMINA</text>
</svg>