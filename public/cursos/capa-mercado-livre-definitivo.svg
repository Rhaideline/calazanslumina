<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-warm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="50%" stop-color="#0d0805"/>
      <stop offset="100%" stop-color="#080503"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C76A"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A88825"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="35%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </radialGradient>
    <radialGradient id="glow-gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(212,175,55,0.25)"/>
      <stop offset="70%" stop-color="rgba(212,175,55,0)"/>
    </radialGradient>
  </defs>

  <!-- BG -->
  <rect width="800" height="600" fill="url(#bg-warm)"/>

  <!-- Glow halos -->
  <circle cx="100" cy="120" r="220" fill="url(#glow-gold)"/>
  <circle cx="720" cy="500" r="200" fill="url(#glow-gold)"/>

  <!-- Vignette overlay -->
  <rect width="800" height="600" fill="url(#vignette)"/>

  <!-- Decorative serif asterisks (gold) -->
  <text x="55" y="80" font-family="Georgia, serif" font-size="32" fill="url(#gold)" opacity="0.45">✦</text>
  <text x="745" y="85" font-family="Georgia, serif" font-size="22" fill="url(#gold)" opacity="0.35">✦</text>
  <text x="745" y="555" font-family="Georgia, serif" font-size="26" fill="url(#gold)" opacity="0.4">✦</text>

  <!-- EYEBROW: MERCADO LIVRE -->
  <text x="400" y="78" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="url(#gold)" text-anchor="middle" letter-spacing="9" opacity="0.95">◆ MERCADO LIVRE ◆</text>

  <!-- Decorative thin line top -->
  <line x1="300" y1="98" x2="500" y2="98" stroke="url(#gold)" stroke-width="0.8" opacity="0.55"/>

  <!-- MAIN TITLE: Do Zero -->
  <text x="400" y="178" font-family="Georgia, 'DM Serif Display', serif" font-size="62" font-weight="700" fill="#F5EDE0" text-anchor="middle" letter-spacing="-1">Do Zero</text>

  <!-- ao Mercado Líder -->
  <text x="400" y="245" font-family="Georgia, 'DM Serif Display', serif" font-size="46" font-weight="400" fill="#F5EDE0" text-anchor="middle" letter-spacing="-0.5" opacity="0.92">ao Mercado Líder</text>

  <!-- "Gold" italic GOLD -->
  <text x="400" y="328" font-family="Georgia, 'DM Serif Display', serif" font-size="88" font-style="italic" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="-2">Gold.</text>

  <!-- Gold divider -->
  <rect x="350" y="358" width="100" height="2" fill="url(#gold)" opacity="0.8"/>

  <!-- Subtitle -->
  <text x="400" y="385" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#F5EDE0" text-anchor="middle" opacity="0.62">O método completo · 2018 · 2026</text>

  <!-- Number-block 126 -->
  <g transform="translate(400 460)">
    <text x="0" y="0" font-family="Georgia, 'DM Serif Display', serif" font-size="92" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="-3">126</text>
  </g>

  <!-- Labels under number -->
  <text x="400" y="495" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#F5EDE0" text-anchor="middle" letter-spacing="6" opacity="0.78">PÁGINAS · 15 MÓDULOS · ACESSO VITALÍCIO</text>

  <!-- Price strip -->
  <rect x="280" y="520" width="240" height="32" rx="2" fill="rgba(212,175,55,0.12)" stroke="url(#gold)" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="400" y="540" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="url(#gold)" text-anchor="middle" letter-spacing="4">DE R$ 297 · POR R$ 9,90</text>

  <!-- Brand footer -->
  <text x="400" y="582" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#F5EDE0" text-anchor="middle" letter-spacing="7" opacity="0.55">CALAZANS LUMINA</text>
</svg>
