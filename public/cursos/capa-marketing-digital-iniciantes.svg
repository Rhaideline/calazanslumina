<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- Background: ink -->
  <rect width="800" height="500" fill="#1A0E0B"/>
  <!-- Right side: bold red block with R$ tipográfico -->
  <rect x="500" y="80" width="280" height="340" fill="#FF0005"/>
  <text x="640" y="290" font-family="Georgia, 'DM Serif Display', serif" font-size="200" font-style="italic" font-weight="700" fill="#1A0E0B" text-anchor="middle">R$</text>
  <!-- Small label below R$ -->
  <text x="640" y="340" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1A0E0B" text-anchor="middle" letter-spacing="3">VENDA MAIS</text>
  <!-- Badge R$ 10 -->
  <rect x="40" y="28" width="110" height="38" rx="2" fill="#FF0005"/>
  <text x="95" y="53" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0d0706" text-anchor="middle" letter-spacing="2">R$ 10</text>
  <!-- Title -->
  <text x="50" y="170" font-family="Georgia, 'DM Serif Display', serif" font-size="58" font-weight="700" fill="#F1EAE0">Marketing</text>
  <text x="50" y="226" font-family="Georgia, 'DM Serif Display', serif" font-size="58" font-weight="700" fill="#F1EAE0">digital para</text>
  <text x="50" y="282" font-family="Georgia, 'DM Serif Display', serif" font-size="58" font-style="italic" font-weight="400" fill="#FF0005">iniciantes.</text>
  <!-- Subtitle -->
  <text x="50" y="328" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#F1EAE0" opacity="0.65">Do tráfego à conversão —</text>
  <text x="50" y="352" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#F1EAE0" opacity="0.65">um plano real pra começar a vender.</text>
  <!-- Stats -->
  <text x="50" y="430" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#F1EAE0" letter-spacing="1" opacity="0.85">7 módulos · 28 aulas · Templates inclusos</text>
  <!-- Brand mark -->
  <text x="750" y="475" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#F1EAE0" text-anchor="end" letter-spacing="3" opacity="0.5">CALAZANS LUMINA</text>
</svg>
