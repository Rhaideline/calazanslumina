<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b91c1c"/>
      <stop offset="100%" style="stop-color:#450a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fca5a5"/>
      <stop offset="100%" style="stop-color:#fecaca"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="680" cy="120" r="150" fill="#ffffff" opacity="0.04"/>
  <circle cx="720" cy="380" r="100" fill="#ffffff" opacity="0.03"/>
  <!-- Rocket icon -->
  <g transform="translate(570, 100)">
    <g opacity="0.8">
      <!-- Rocket body -->
      <path d="M100 180 L100 80 Q100 30 130 10 Q160 30 160 80 L160 180Z" fill="#ffffff" opacity="0.15"/>
      <path d="M105 175 L105 85 Q105 40 130 20 Q155 40 155 85 L155 175Z" fill="#ffffff" opacity="0.1"/>
      <!-- Rocket window -->
      <circle cx="130" cy="80" r="15" fill="#fca5a5" opacity="0.5"/>
      <circle cx="130" cy="80" r="10" fill="#ffffff" opacity="0.15"/>
      <!-- Fins -->
      <path d="M100 160 L75 195 L100 185Z" fill="#fca5a5" opacity="0.4"/>
      <path d="M160 160 L185 195 L160 185Z" fill="#fca5a5" opacity="0.4"/>
      <!-- Flame -->
      <path d="M110 180 Q115 210 130 230 Q145 210 150 180Z" fill="#fbbf24" opacity="0.5"/>
      <path d="M118 180 Q122 200 130 215 Q138 200 142 180Z" fill="#f97316" opacity="0.4"/>
    </g>
    <!-- Stars -->
    <circle cx="40" cy="60" r="3" fill="#fca5a5" opacity="0.5"/>
    <circle cx="200" cy="40" r="2" fill="#fca5a5" opacity="0.4"/>
    <circle cx="30" cy="150" r="2" fill="#fca5a5" opacity="0.3"/>
    <circle cx="210" cy="130" r="3" fill="#fca5a5" opacity="0.4"/>
  </g>
  <!-- Bar chart -->
  <g transform="translate(590, 320)" opacity="0.25">
    <rect x="0" y="40" width="20" height="40" rx="3" fill="#fca5a5"/>
    <rect x="30" y="25" width="20" height="55" rx="3" fill="#fca5a5"/>
    <rect x="60" y="10" width="20" height="70" rx="3" fill="#fca5a5"/>
    <rect x="90" y="0" width="20" height="80" rx="3" fill="#fca5a5"/>
    <path d="M5 38 L35 22 L65 8 L95 -3" fill="none" stroke="#fecaca" stroke-width="2"/>
  </g>
  <!-- Badge -->
  <rect x="50" y="30" width="100" height="36" rx="18" fill="#ef4444"/>
  <text x="100" y="54" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">R$20</text>
  <!-- Title -->
  <text x="50" y="155" font-family="Georgia,serif" font-size="40" font-weight="bold" fill="#ffffff">Marketing</text>
  <text x="50" y="205" font-family="Georgia,serif" font-size="40" font-weight="bold" fill="#ffffff">Digital</text>
  <text x="50" y="250" font-family="Georgia,serif" font-size="30" font-weight="bold" fill="#fca5a5">para Iniciantes</text>
  <!-- Divider -->
  <rect x="50" y="268" width="80" height="4" rx="2" fill="url(#accent)"/>
  <!-- Subtitle -->
  <text x="50" y="305" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.7">Estrategias praticas para</text>
  <text x="50" y="330" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.7">atrair clientes e vender online.</text>
  <!-- Stats -->
  <text x="50" y="380" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#fca5a5" font-weight="bold">6 modulos  ·  32 aulas  ·  Certificado</text>
  <!-- Footer -->
  <rect x="0" y="440" width="800" height="60" fill="#000000" opacity="0.3"/>
  <text x="50" y="478" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" opacity="0.6" letter-spacing="3">CALAZANS LUMINA</text>
</svg>