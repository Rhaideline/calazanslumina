<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="ink-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A0E0B"/>
      <stop offset="100%" stop-color="#0d0706"/>
    </linearGradient>
  </defs>
  <!-- Background: ink gradient -->
  <rect width="800" height="500" fill="url(#ink-grad)"/>
  <!-- Right side: stylized 3D book (3 stacked rects with perspective) -->
  <g transform="translate(640, 250)">
    <!-- Back pages shadow -->
    <rect x="-90" y="-145" width="180" height="280" fill="#9C0307" transform="skewY(-3)"/>
    <!-- Middle book layer -->
    <rect x="-95" y="-140" width="180" height="280" fill="#C9A96E"/>
    <!-- Front cover -->
    <rect x="-100" y="-150" width="180" height="280" fill="#F1EAE0"/>
    <!-- Spine accent -->
    <rect x="-100" y="-150" width="14" height="280" fill="#FF0005"/>
    <!-- Title text on cover -->
    <text x="-10" y="-100" font-family="Georgia, 'DM Serif Display', serif" font-size="16" font-style="italic" font-weight="400" fill="#1A0E0B" text-anchor="middle">IA para</text>
    <text x="-10" y="-78" font-family="Georgia, 'DM Serif Display', serif" font-size="20" font-weight="700" fill="#1A0E0B" text-anchor="middle">Marketing</text>
    <!-- Decorative divider -->
    <rect x="-30" y="-62" width="40" height="2" fill="#9C0307"/>
    <!-- Author block -->
    <text x="-10" y="115" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#1A0E0B" text-anchor="middle" letter-spacing="2" opacity="0.7">CALAZANS LUMINA</text>
  </g>
  <!-- Badge EBOOK (gold) -->
  <rect x="40" y="28" width="110" height="38" rx="2" fill="#C9A96E"/>
  <text x="95" y="53" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1A0E0B" text-anchor="middle" letter-spacing="3">EBOOK</text>
  <!-- Title -->
  <text x="50" y="170" font-family="Georgia, 'DM Serif Display', serif" font-size="58" font-weight="700" fill="#F1EAE0">IA para</text>
  <text x="50" y="228" font-family="Georgia, 'DM Serif Display', serif" font-size="58" font-weight="700" fill="#F1EAE0">marketing</text>
  <text x="50" y="290" font-family="Georgia, 'DM Serif Display', serif" font-size="58" font-style="italic" font-weight="400" fill="#C9A96E">de sites.</text>
  <!-- Subtitle -->
  <text x="50" y="336" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#F1EAE0" opacity="0.65">120 páginas. Prompts prontos.</text>
  <text x="50" y="360" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#F1EAE0" opacity="0.65">Estratégia que funciona em 2026.</text>
  <!-- Stats -->
  <text x="50" y="430" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#F1EAE0" letter-spacing="1" opacity="0.85">PDF · 120 pgs · Bônus: prompts &amp; checklist</text>
  <!-- Brand mark -->
  <text x="750" y="475" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#F1EAE0" text-anchor="end" letter-spacing="3" opacity="0.5">CALAZANS LUMINA</text>
</svg>
