<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- Background: cream warm -->
  <rect width="800" height="500" fill="#F1EAE0"/>
  <!-- Subtle map grid lines -->
  <g stroke="#1A0E0B" stroke-width="0.8" opacity="0.06">
    <line x1="480" y1="60" x2="480" y2="420"/>
    <line x1="560" y1="60" x2="560" y2="420"/>
    <line x1="640" y1="60" x2="640" y2="420"/>
    <line x1="720" y1="60" x2="720" y2="420"/>
    <line x1="450" y1="140" x2="780" y2="140"/>
    <line x1="450" y1="230" x2="780" y2="230"/>
    <line x1="450" y1="320" x2="780" y2="320"/>
  </g>
  <!-- Map pin geometric (right side) -->
  <g transform="translate(640, 240)">
    <!-- Pin body: rounded teardrop -->
    <path d="M 0 -110 C 50 -110, 80 -75, 80 -35 C 80 10, 30 60, 0 110 C -30 60, -80 10, -80 -35 C -80 -75, -50 -110, 0 -110 Z" fill="#FF0005"/>
    <!-- Inner circle (white hole) -->
    <circle cx="0" cy="-40" r="28" fill="#F1EAE0"/>
    <!-- Pin shadow base -->
    <ellipse cx="0" cy="125" rx="40" ry="6" fill="#1A0E0B" opacity="0.15"/>
  </g>
  <!-- Badge GRÁTIS -->
  <rect x="40" y="28" width="120" height="38" rx="2" fill="#16a34a"/>
  <text x="100" y="53" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">GRÁTIS</text>
  <!-- Title -->
  <text x="50" y="170" font-family="Georgia, 'DM Serif Display', serif" font-size="60" font-weight="700" fill="#1A0E0B">Google Meu</text>
  <text x="50" y="230" font-family="Georgia, 'DM Serif Display', serif" font-size="60" font-style="italic" font-weight="400" fill="#9C0307">Negócio</text>
  <text x="50" y="285" font-family="Georgia, 'DM Serif Display', serif" font-size="34" font-weight="400" fill="#1A0E0B" opacity="0.6">do zero ao topo do Maps.</text>
  <!-- Subtitle -->
  <text x="50" y="325" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A0E0B" opacity="0.65">Apareça em primeiro nas buscas locais</text>
  <text x="50" y="349" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A0E0B" opacity="0.65">— sem pagar anúncio.</text>
  <!-- Stats -->
  <text x="50" y="430" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1A0E0B" letter-spacing="1">6 módulos · 22 aulas · Checklist incluso</text>
  <!-- Brand mark -->
  <text x="750" y="475" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1A0E0B" text-anchor="end" letter-spacing="3" opacity="0.5">CALAZANS LUMINA</text>
</svg>
