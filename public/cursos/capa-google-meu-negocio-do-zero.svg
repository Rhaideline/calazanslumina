<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d4ed8"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#93c5fd"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Decorative -->
  <circle cx="700" cy="100" r="160" fill="#ffffff" opacity="0.03"/>
  <circle cx="650" cy="400" r="120" fill="#ffffff" opacity="0.03"/>
  <!-- Map pin icon -->
  <g transform="translate(570, 80)">
    <g opacity="0.8">
      <!-- Pin shape -->
      <path d="M100 0 C60 0 30 30 30 70 C30 120 100 200 100 200 C100 200 170 120 170 70 C170 30 140 0 100 0Z" fill="#3b82f6" opacity="0.2"/>
      <path d="M100 10 C65 10 40 35 40 70 C40 110 100 180 100 180 C100 180 160 110 160 70 C160 35 135 10 100 10Z" fill="none" stroke="#60a5fa" stroke-width="2.5" opacity="0.5"/>
      <!-- Inner circle -->
      <circle cx="100" cy="70" r="30" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
      <circle cx="100" cy="70" r="15" fill="#60a5fa" opacity="0.4"/>
      <!-- Google colors dots -->
      <circle cx="90" cy="62" r="5" fill="#4285f4" opacity="0.7"/>
      <circle cx="110" cy="62" r="5" fill="#ea4335" opacity="0.7"/>
      <circle cx="90" cy="78" r="5" fill="#34a853" opacity="0.7"/>
      <circle cx="110" cy="78" r="5" fill="#fbbc04" opacity="0.7"/>
    </g>
  </g>
  <!-- Stars rating -->
  <g transform="translate(580, 310)" opacity="0.4">
    <polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9" fill="#fbbf24"/>
    <polygon points="37,2 40,9 47,9 41,14 43,21 37,17 31,21 33,14 27,9 34,9" fill="#fbbf24"/>
    <polygon points="62,2 65,9 72,9 66,14 68,21 62,17 56,21 58,14 52,9 59,9" fill="#fbbf24"/>
    <polygon points="87,2 90,9 97,9 91,14 93,21 87,17 81,21 83,14 77,9 84,9" fill="#fbbf24"/>
    <polygon points="112,2 115,9 122,9 116,14 118,21 112,17 106,21 108,14 102,9 109,9" fill="#fbbf24"/>
  </g>
  <!-- Search bar -->
  <g transform="translate(570, 360)" opacity="0.2">
    <rect x="0" y="0" width="170" height="40" rx="20" fill="none" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="145" cy="20" r="12" fill="#60a5fa" opacity="0.5"/>
    <line x1="140" y1="15" x2="150" y2="25" stroke="#ffffff" stroke-width="2"/>
  </g>
  <!-- Badge -->
  <rect x="50" y="30" width="100" height="36" rx="18" fill="#3b82f6"/>
  <text x="100" y="54" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">R$20</text>
  <!-- Title -->
  <text x="50" y="150" font-family="Georgia,serif" font-size="40" font-weight="bold" fill="#ffffff">Google Meu</text>
  <text x="50" y="200" font-family="Georgia,serif" font-size="40" font-weight="bold" fill="#ffffff">Negocio</text>
  <text x="50" y="245" font-family="Georgia,serif" font-size="30" font-weight="bold" fill="#93c5fd">do Zero</text>
  <!-- Divider -->
  <rect x="50" y="262" width="80" height="4" rx="2" fill="url(#accent)"/>
  <!-- Subtitle -->
  <text x="50" y="300" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.7">Apareca no Google Maps,</text>
  <text x="50" y="325" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.7">conquiste avaliacoes 5 estrelas</text>
  <text x="50" y="350" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.7">e atraia clientes locais.</text>
  <!-- Stats -->
  <text x="50" y="395" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#60a5fa" font-weight="bold">5 modulos  ·  28 aulas  ·  Certificado</text>
  <!-- Footer -->
  <rect x="0" y="440" width="800" height="60" fill="#000000" opacity="0.3"/>
  <text x="50" y="478" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" opacity="0.6" letter-spacing="3">CALAZANS LUMINA</text>
</svg>