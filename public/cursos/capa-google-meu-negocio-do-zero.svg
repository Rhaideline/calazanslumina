<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="google" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285f4"/>
      <stop offset="25%" style="stop-color:#ea4335"/>
      <stop offset="50%" style="stop-color:#fbbc05"/>
      <stop offset="75%" style="stop-color:#34a853"/>
      <stop offset="100%" style="stop-color:#4285f4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Google-colored stripe at top -->
  <rect x="0" y="0" width="800" height="5" fill="url(#google)"/>
  <!-- Map grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="500" y1="0" x2="500" y2="500"/><line x1="570" y1="0" x2="570" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/><line x1="710" y1="0" x2="710" y2="500"/>
    <line x1="500" y1="70" x2="800" y2="70"/><line x1="500" y1="140" x2="800" y2="140"/>
    <line x1="500" y1="210" x2="800" y2="210"/><line x1="500" y1="280" x2="800" y2="280"/>
    <line x1="500" y1="350" x2="800" y2="350"/>
  </g>
  <!-- Map Pin icon (right side, large, semi-transparent) -->
  <g transform="translate(565, 80)" opacity="0.16">
    <path d="M95 0 Q150 0 150 55 Q150 110 95 180 Q40 110 40 55 Q40 0 95 0 Z" fill="none" stroke="#ea4335" stroke-width="4.5"/>
    <circle cx="95" cy="60" r="28" fill="none" stroke="#ea4335" stroke-width="3"/>
    <circle cx="95" cy="60" r="10" fill="#ea4335" opacity="0.5"/>
    <!-- Pulse rings -->
    <circle cx="95" cy="60" r="45" fill="none" stroke="#ea4335" stroke-width="1.5" opacity="0.3"/>
    <circle cx="95" cy="60" r="62" fill="none" stroke="#ea4335" stroke-width="1" opacity="0.15"/>
  </g>
  <!-- Google-colored accent circles -->
  <circle cx="600" cy="310" r="18" fill="#4285f4" opacity="0.1"/>
  <circle cx="690" cy="280" r="12" fill="#ea4335" opacity="0.1"/>
  <circle cx="650" cy="360" r="15" fill="#fbbc05" opacity="0.1"/>
  <circle cx="740" cy="330" r="10" fill="#34a853" opacity="0.1"/>
  <!-- Star ratings -->
  <g transform="translate(580, 380)" opacity="0.2">
    <polygon points="10,1 13,7 19,7 14,11 16,17 10,14 4,17 6,11 1,7 7,7" fill="#fbbc05"/>
    <polygon points="30,1 33,7 39,7 34,11 36,17 30,14 24,17 26,11 21,7 27,7" fill="#fbbc05"/>
    <polygon points="50,1 53,7 59,7 54,11 56,17 50,14 44,17 46,11 41,7 47,7" fill="#fbbc05"/>
    <polygon points="70,1 73,7 79,7 74,11 76,17 70,14 64,17 66,11 61,7 67,7" fill="#fbbc05"/>
    <polygon points="90,1 93,7 99,7 94,11 96,17 90,14 84,17 86,11 81,7 87,7" fill="#fbbc05"/>
  </g>
  <!-- Badge -->
  <rect x="40" y="33" width="110" height="42" rx="21" fill="#4285f4"/>
  <text x="95" y="60" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">R$20</text>
  <!-- Title -->
  <text x="50" y="152" font-family="Georgia,serif" font-size="46" font-weight="bold" fill="#ffffff">Google Meu</text>
  <text x="50" y="206" font-family="Georgia,serif" font-size="46" font-weight="bold" fill="#ffffff">Negócio</text>
  <text x="50" y="258" font-family="Georgia,serif" font-size="44" font-weight="bold" fill="#fbbc05">do Zero</text>
  <!-- Google-colored divider -->
  <rect x="50" y="276" width="22" height="4" rx="2" fill="#4285f4"/>
  <rect x="77" y="276" width="22" height="4" rx="2" fill="#ea4335"/>
  <rect x="104" y="276" width="22" height="4" rx="2" fill="#fbbc05"/>
  <rect x="131" y="276" width="22" height="4" rx="2" fill="#34a853"/>
  <!-- Subtitle -->
  <text x="50" y="314" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.8">Coloque sua empresa no mapa.</text>
  <text x="50" y="339" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.8">Atraia clientes locais com o Google.</text>
  <!-- Stats -->
  <text x="50" y="388" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4285f4" font-weight="bold">8 módulos  ·  35 aulas  ·  Certificado</text>
  <!-- Footer -->
  <rect x="0" y="440" width="800" height="60" fill="#000000" opacity="0.25"/>
  <text x="50" y="478" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#ffffff" opacity="0.45" letter-spacing="3">CALAZANS LUMINA</text>
</svg>