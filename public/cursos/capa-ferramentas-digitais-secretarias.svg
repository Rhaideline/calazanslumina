<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e"/>
      <stop offset="100%" style="stop-color:#042f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5eead4"/>
      <stop offset="100%" style="stop-color:#99f6e4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Decorative -->
  <circle cx="700" cy="110" r="150" fill="#ffffff" opacity="0.03"/>
  <circle cx="650" cy="420" r="100" fill="#ffffff" opacity="0.02"/>
  <!-- Laptop icon -->
  <g transform="translate(560, 80)">
    <!-- Screen -->
    <rect x="20" y="0" width="160" height="110" rx="8" fill="#ffffff" opacity="0.12"/>
    <rect x="28" y="8" width="144" height="94" rx="4" fill="#042f2e" opacity="0.3"/>
    <!-- Screen content - spreadsheet -->
    <g transform="translate(36, 16)" opacity="0.5">
      <rect x="0" y="0" width="60" height="12" rx="2" fill="#5eead4" opacity="0.6"/>
      <rect x="65" y="0" width="40" height="12" rx="2" fill="#5eead4" opacity="0.4"/>
      <rect x="110" y="0" width="18" height="12" rx="2" fill="#5eead4" opacity="0.3"/>
      <rect x="0" y="16" width="60" height="10" rx="2" fill="#ffffff" opacity="0.15"/>
      <rect x="65" y="16" width="40" height="10" rx="2" fill="#ffffff" opacity="0.1"/>
      <rect x="110" y="16" width="18" height="10" rx="2" fill="#ffffff" opacity="0.1"/>
      <rect x="0" y="30" width="60" height="10" rx="2" fill="#ffffff" opacity="0.15"/>
      <rect x="65" y="30" width="40" height="10" rx="2" fill="#ffffff" opacity="0.1"/>
      <rect x="110" y="30" width="18" height="10" rx="2" fill="#ffffff" opacity="0.1"/>
      <rect x="0" y="44" width="60" height="10" rx="2" fill="#ffffff" opacity="0.15"/>
      <rect x="65" y="44" width="40" height="10" rx="2" fill="#ffffff" opacity="0.1"/>
      <rect x="0" y="58" width="60" height="10" rx="2" fill="#ffffff" opacity="0.12"/>
      <rect x="65" y="58" width="40" height="10" rx="2" fill="#ffffff" opacity="0.08"/>
    </g>
    <!-- Laptop base -->
    <rect x="0" y="112" width="200" height="12" rx="4" fill="#ffffff" opacity="0.1"/>
    <rect x="70" y="118" width="60" height="6" rx="3" fill="#ffffff" opacity="0.08"/>
  </g>
  <!-- Tool icons -->
  <g transform="translate(580, 230)" opacity="0.35">
    <!-- Google icon -->
    <circle cx="15" cy="15" r="14" fill="#4285f4" opacity="0.7"/>
    <text x="15" y="20" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">G</text>
    <!-- Calendar -->
    <rect x="45" y="2" width="28" height="26" rx="4" fill="#5eead4" opacity="0.5"/>
    <rect x="47" y="0" width="24" height="6" rx="2" fill="#0d9488" opacity="0.5"/>
    <text x="59" y="22" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="bold" fill="#042f2e" text-anchor="middle">31</text>
    <!-- Email -->
    <rect x="90" y="4" width="28" height="22" rx="4" fill="#f59e0b" opacity="0.5"/>
    <path d="M93 7 L104 16 L115 7" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  </g>
  <!-- Checklist -->
  <g transform="translate(580, 290)" opacity="0.25">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="none" stroke="#5eead4" stroke-width="1.5"/>
    <path d="M2 6 L5 9 L10 3" fill="none" stroke="#5eead4" stroke-width="1.5"/>
    <rect x="20" y="2" width="80" height="8" rx="3" fill="#5eead4"/>
    <rect x="0" y="22" width="12" height="12" rx="2" fill="none" stroke="#5eead4" stroke-width="1.5"/>
    <path d="M2 28 L5 31 L10 25" fill="none" stroke="#5eead4" stroke-width="1.5"/>
    <rect x="20" y="24" width="60" height="8" rx="3" fill="#5eead4"/>
    <rect x="0" y="44" width="12" height="12" rx="2" fill="none" stroke="#5eead4" stroke-width="1.5"/>
    <rect x="20" y="46" width="70" height="8" rx="3" fill="#5eead4" opacity="0.5"/>
  </g>
  <!-- Badge GRATUITO -->
  <rect x="50" y="30" width="140" height="36" rx="18" fill="#14b8a6"/>
  <text x="120" y="54" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">GRATUITO</text>
  <!-- Title -->
  <text x="50" y="150" font-family="Georgia,serif" font-size="36" font-weight="bold" fill="#ffffff">Ferramentas</text>
  <text x="50" y="196" font-family="Georgia,serif" font-size="36" font-weight="bold" fill="#ffffff">Digitais para</text>
  <text x="50" y="240" font-family="Georgia,serif" font-size="34" font-weight="bold" fill="#99f6e4">Secretarias</text>
  <!-- Divider -->
  <rect x="50" y="258" width="80" height="4" rx="2" fill="url(#accent)"/>
  <!-- Subtitle -->
  <text x="50" y="295" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.7">Google Workspace, Canva,</text>
  <text x="50" y="320" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.7">automacao e organizacao</text>
  <text x="50" y="345" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.7">para o dia a dia profissional.</text>
  <!-- Stats -->
  <text x="50" y="392" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#5eead4" font-weight="bold">6 modulos  ·  26 aulas  ·  Passo a passo</text>
  <!-- Footer -->
  <rect x="0" y="440" width="800" height="60" fill="#000000" opacity="0.3"/>
  <text x="50" y="478" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" opacity="0.6" letter-spacing="3">CALAZANS LUMINA</text>
</svg>