<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- Background: cream warm -->
  <rect width="800" height="500" fill="#F1EAE0"/>
  <!-- Right side: geometric laptop -->
  <g transform="translate(640, 250)">
    <!-- Laptop screen -->
    <rect x="-130" y="-90" width="260" height="160" rx="6" fill="#1A0E0B"/>
    <rect x="-120" y="-80" width="240" height="140" rx="2" fill="#F1EAE0"/>
    <!-- Screen content: 3 horizontal lines -->
    <rect x="-105" y="-65" width="100" height="10" rx="2" fill="#1A0E0B" opacity="0.85"/>
    <rect x="-105" y="-45" width="160" height="6" rx="2" fill="#1A0E0B" opacity="0.4"/>
    <rect x="-105" y="-30" width="140" height="6" rx="2" fill="#1A0E0B" opacity="0.4"/>
    <rect x="-105" y="-15" width="180" height="6" rx="2" fill="#1A0E0B" opacity="0.4"/>
    <!-- Red check mark accent -->
    <rect x="-105" y="20" width="60" height="22" rx="2" fill="#FF0005"/>
    <text x="-75" y="36" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#F1EAE0" text-anchor="middle" letter-spacing="2">FEITO</text>
    <!-- Base -->
    <path d="M -160 75 L 160 75 L 145 90 L -145 90 Z" fill="#1A0E0B"/>
  </g>
  <!-- Badge GRÁTIS -->
  <rect x="40" y="28" width="120" height="38" rx="2" fill="#16a34a"/>
  <text x="100" y="53" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">GRÁTIS</text>
  <!-- Title -->
  <text x="50" y="170" font-family="Georgia, 'DM Serif Display', serif" font-size="56" font-weight="700" fill="#1A0E0B">Ferramentas</text>
  <text x="50" y="226" font-family="Georgia, 'DM Serif Display', serif" font-size="56" font-weight="700" fill="#1A0E0B">digitais para</text>
  <text x="50" y="282" font-family="Georgia, 'DM Serif Display', serif" font-size="56" font-style="italic" font-weight="400" fill="#9C0307">secretárias.</text>
  <!-- Subtitle -->
  <text x="50" y="328" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A0E0B" opacity="0.65">Produtividade real no escritório —</text>
  <text x="50" y="352" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1A0E0B" opacity="0.65">Drive, Trello, IA e muito mais.</text>
  <!-- Stats -->
  <text x="50" y="430" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1A0E0B" letter-spacing="1">5 módulos · 18 aulas · Atalhos &amp; templates</text>
  <!-- Brand mark -->
  <text x="750" y="475" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1A0E0B" text-anchor="end" letter-spacing="3" opacity="0.5">CALAZANS LUMINA</text>
</svg>
