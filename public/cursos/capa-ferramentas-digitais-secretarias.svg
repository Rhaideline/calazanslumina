<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e"/>
      <stop offset="50%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#5eead4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ccfbf1"/>
      <stop offset="100%" style="stop-color:#99f6e4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Geometric grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1" fill="none">
    <rect x="550" y="40" width="55" height="55" rx="8"/>
    <rect x="620" y="40" width="55" height="55" rx="8"/>
    <rect x="690" y="40" width="55" height="55" rx="8"/>
    <rect x="550" y="110" width="55" height="55" rx="8"/>
    <rect x="620" y="110" width="55" height="55" rx="8"/>
    <rect x="690" y="110" width="55" height="55" rx="8"/>
  </g>
  <!-- Monitor icon (right side, semi-transparent) -->
  <g transform="translate(555, 170)" opacity="0.14">
    <rect x="20" y="0" width="170" height="115" rx="12" fill="none" stroke="#ffffff" stroke-width="4"/>
    <line x1="105" y1="115" x2="105" y2="148" stroke="#ffffff" stroke-width="4"/>
    <line x1="60" y1="148" x2="150" y2="148" stroke="#ffffff" stroke-width="4"/>
    <!-- Screen content lines -->
    <rect x="40" y="20" width="90" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
    <rect x="40" y="38" width="70" height="8" rx="4" fill="#ffffff" opacity="0.3"/>
    <rect x="40" y="56" width="110" height="8" rx="4" fill="#ffffff" opacity="0.4"/>
    <rect x="40" y="74" width="60" height="8" rx="4" fill="#ffffff" opacity="0.3"/>
    <!-- Cursor -->
    <path d="M150 60 L150 90 L160 82 L170 95 L176 91 L166 78 L178 75 Z" fill="#ffffff" opacity="0.6"/>
  </g>
  <!-- Clipboard icon -->
  <g transform="translate(600, 320)" opacity="0.12">
    <rect x="0" y="12" width="80" height="100" rx="8" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <rect x="20" y="0" width="40" height="24" rx="6" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <!-- Checkmarks -->
    <path d="M18 45 L28 55 L42 38" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <rect x="50" y="44" width="20" height="6" rx="3" fill="#ffffff" opacity="0.5"/>
    <path d="M18 72 L28 82 L42 65" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <rect x="50" y="71" width="20" height="6" rx="3" fill="#ffffff" opacity="0.5"/>
  </g>
  <!-- Badge GRATIS -->
  <rect x="40" y="28" width="130" height="42" rx="21" fill="#16a34a"/>
  <text x="105" y="55" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">GRÁTIS</text>
  <!-- Title -->
  <text x="50" y="148" font-family="Georgia,serif" font-size="42" font-weight="bold" fill="#ffffff">Ferramentas</text>
  <text x="50" y="200" font-family="Georgia,serif" font-size="42" font-weight="bold" fill="#ffffff">Digitais para</text>
  <text x="50" y="252" font-family="Georgia,serif" font-size="42" font-weight="bold" fill="#ccfbf1">Secretárias</text>
  <!-- Divider -->
  <rect x="50" y="270" width="90" height="4" rx="2" fill="url(#accent)"/>
  <!-- Subtitle -->
  <text x="50" y="308" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.85">Domine as ferramentas essenciais</text>
  <text x="50" y="333" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.85">do escritório moderno.</text>
  <!-- Stats -->
  <text x="50" y="382" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#ccfbf1" font-weight="bold" opacity="0.9">8 módulos  ·  38 aulas  ·  Certificado</text>
  <!-- Footer -->
  <rect x="0" y="440" width="800" height="60" fill="#000000" opacity="0.25"/>
  <text x="50" y="478" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#ffffff" opacity="0.45" letter-spacing="3">CALAZANS LUMINA</text>
</svg>