<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- Background: warm cream -->
  <rect width="800" height="500" fill="#F1EAE0"/>
  <!-- Subtle vertical divider hint -->
  <rect x="480" y="0" width="1" height="500" fill="#1A0E0B" opacity="0.06"/>
  <!-- Right side visual: large cream circle with serif italic C -->
  <circle cx="640" cy="250" r="170" fill="#1A0E0B" opacity="0.04"/>
  <circle cx="640" cy="250" r="170" fill="none" stroke="#1A0E0B" stroke-width="1.5" opacity="0.25"/>
  <text x="640" y="320" font-family="Georgia, 'DM Serif Display', serif" font-size="240" font-style="italic" font-weight="400" fill="#1A0E0B" text-anchor="middle" opacity="0.92">C</text>
  <!-- Badge GRÁTIS -->
  <rect x="40" y="28" width="120" height="38" rx="2" fill="#16a34a"/>
  <text x="100" y="53" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">GRÁTIS</text>
  <!-- Title -->
  <text x="50" y="170" font-family="Georgia, 'DM Serif Display', serif" font-size="66" font-weight="700" fill="#1A0E0B">ChatGPT</text>
  <text x="50" y="232" font-family="Georgia, 'DM Serif Display', serif" font-size="62" font-style="italic" font-weight="400" fill="#9C0307">para idosos.</text>
  <!-- Subtitle -->
  <text x="50" y="282" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A0E0B" opacity="0.7">Aprenda IA no seu ritmo —</text>
  <text x="50" y="308" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1A0E0B" opacity="0.7">simples, acolhedor, sem pressa.</text>
  <!-- Stats -->
  <text x="50" y="430" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1A0E0B" letter-spacing="1">8 módulos · 32 aulas · Acesso vitalício</text>
  <!-- Brand mark -->
  <text x="750" y="475" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1A0E0B" text-anchor="end" letter-spacing="3" opacity="0.5">CALAZANS LUMINA</text>
</svg>
