<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a7a4c"/>
      <stop offset="100%" style="stop-color:#0d3d26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#6ee7b7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Pattern circles -->
  <circle cx="650" cy="80" r="120" fill="#ffffff" opacity="0.03"/>
  <circle cx="700" cy="400" r="180" fill="#ffffff" opacity="0.03"/>
  <circle cx="100" cy="450" r="80" fill="#ffffff" opacity="0.03"/>
  <!-- Chat bubble icon -->
  <g transform="translate(560, 100)">
    <rect x="0" y="0" width="160" height="120" rx="20" fill="#ffffff" opacity="0.15"/>
    <rect x="10" y="10" width="140" height="100" rx="16" fill="#ffffff" opacity="0.1"/>
    <polygon points="30,120 50,120 20,150" fill="#ffffff" opacity="0.15"/>
    <!-- Robot face -->
    <circle cx="80" cy="55" r="30" fill="none" stroke="#34d399" stroke-width="2.5" opacity="0.8"/>
    <circle cx="68" cy="48" r="5" fill="#34d399" opacity="0.8"/>
    <circle cx="92" cy="48" r="5" fill="#34d399" opacity="0.8"/>
    <path d="M65 65 Q80 78 95 65" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="80" y1="20" x2="80" y2="8" stroke="#34d399" stroke-width="2" opacity="0.6"/>
    <circle cx="80" cy="5" r="4" fill="#34d399" opacity="0.6"/>
  </g>
  <!-- Heart icon -->
  <g transform="translate(580, 280)" opacity="0.5">
    <path d="M25 10 C25 0, 0 0, 0 15 C0 30, 25 45, 25 45 C25 45, 50 30, 50 15 C50 0, 25 0, 25 10Z" fill="#34d399"/>
  </g>
  <!-- Glasses icon -->
  <g transform="translate(600, 350)" opacity="0.3">
    <circle cx="20" cy="15" r="18" fill="none" stroke="#6ee7b7" stroke-width="3"/>
    <circle cx="65" cy="15" r="18" fill="none" stroke="#6ee7b7" stroke-width="3"/>
    <line x1="38" y1="15" x2="47" y2="15" stroke="#6ee7b7" stroke-width="3"/>
    <line x1="0" y1="10" x2="-10" y2="5" stroke="#6ee7b7" stroke-width="3"/>
    <line x1="85" y1="10" x2="95" y2="5" stroke="#6ee7b7" stroke-width="3"/>
  </g>
  <!-- Badge GRATUITO -->
  <rect x="50" y="30" width="140" height="36" rx="18" fill="#34d399"/>
  <text x="120" y="54" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">GRATUITO</text>
  <!-- Title -->
  <text x="50" y="160" font-family="Georgia,serif" font-size="42" font-weight="bold" fill="#ffffff">ChatGPT</text>
  <text x="50" y="210" font-family="Georgia,serif" font-size="42" font-weight="bold" fill="#ffffff">para Idosos</text>
  <!-- Divider -->
  <rect x="50" y="230" width="80" height="4" rx="2" fill="url(#accent)"/>
  <!-- Subtitle -->
  <text x="50" y="270" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#ffffff" opacity="0.7">Aprenda a usar IA do zero</text>
  <text x="50" y="295" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#ffffff" opacity="0.7">com linguagem simples</text>
  <!-- Stats -->
  <text x="50" y="350" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#34d399" font-weight="bold">6 modulos  ·  27 aulas  ·  Passo a passo visual</text>
  <!-- Footer -->
  <rect x="0" y="440" width="800" height="60" fill="#000000" opacity="0.3"/>
  <text x="50" y="478" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff" opacity="0.6" letter-spacing="3">CALAZANS LUMINA</text>
</svg>