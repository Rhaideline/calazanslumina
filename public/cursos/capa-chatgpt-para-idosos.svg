<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5f3ff"/>
      <stop offset="100%" style="stop-color:#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Soft circle decorations -->
  <circle cx="700" cy="80" r="180" fill="#ffffff" opacity="0.04"/>
  <circle cx="750" cy="350" r="120" fill="#ffffff" opacity="0.03"/>
  <circle cx="100" cy="450" r="80" fill="#ffffff" opacity="0.03"/>
  <!-- Brain icon (right side, semi-transparent) -->
  <g transform="translate(540, 80)" opacity="0.15">
    <circle cx="110" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="110" cy="100" r="65" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- Brain paths -->
    <path d="M80 100 Q80 55 110 55 Q140 55 140 85 Q155 65 135 48 Q110 30 90 48" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <path d="M80 100 Q80 145 110 145 Q140 145 140 115 Q155 135 135 152 Q110 170 90 152" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <line x1="110" y1="55" x2="110" y2="145" stroke="#ffffff" stroke-width="2"/>
  </g>
  <!-- Heart icon (below brain) -->
  <g transform="translate(590, 270)" opacity="0.15">
    <path d="M50 25 Q50 0 25 0 Q0 0 0 22 Q0 48 50 80 Q100 48 100 22 Q100 0 75 0 Q50 0 50 25 Z" fill="#ffffff"/>
  </g>
  <!-- Sparkles -->
  <g opacity="0.35">
    <g transform="translate(720, 60)">
      <line x1="8" y1="0" x2="8" y2="16" stroke="#ffffff" stroke-width="2"/>
      <line x1="0" y1="8" x2="16" y2="8" stroke="#ffffff" stroke-width="2"/>
    </g>
    <g transform="translate(550, 380)">
      <line x1="6" y1="0" x2="6" y2="12" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="0" y1="6" x2="12" y2="6" stroke="#ffffff" stroke-width="1.5"/>
    </g>
    <circle cx="680" cy="400" r="2.5" fill="#ffffff" opacity="0.5"/>
    <circle cx="760" cy="200" r="2" fill="#ffffff" opacity="0.5"/>
  </g>
  <!-- Badge GRATIS -->
  <rect x="40" y="28" width="130" height="42" rx="21" fill="#16a34a"/>
  <text x="105" y="55" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">GRÁTIS</text>
  <!-- Title -->
  <text x="50" y="152" font-family="Georgia,serif" font-size="50" font-weight="bold" fill="#ffffff">ChatGPT</text>
  <text x="50" y="210" font-family="Georgia,serif" font-size="44" font-weight="bold" fill="#f5f3ff">para Idosos</text>
  <!-- Divider -->
  <rect x="50" y="230" width="90" height="4" rx="2" fill="url(#accent)"/>
  <!-- Subtitle -->
  <text x="50" y="272" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.85">Aprenda inteligência artificial</text>
  <text x="50" y="297" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.85">de forma simples e acolhedora.</text>
  <text x="50" y="322" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#ffffff" opacity="0.85">Sem complicação, no seu ritmo.</text>
  <!-- Stats -->
  <text x="50" y="375" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#f5f3ff" font-weight="bold" opacity="0.9">8 módulos  ·  32 aulas  ·  Certificado</text>
  <!-- Footer -->
  <rect x="0" y="440" width="800" height="60" fill="#000000" opacity="0.25"/>
  <text x="50" y="478" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#ffffff" opacity="0.45" letter-spacing="3">CALAZANS LUMINA</text>
</svg>