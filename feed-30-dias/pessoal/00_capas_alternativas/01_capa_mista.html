<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>capa-mista</title>
<style>
@font-face{font-family:'DM Serif Display';font-style:italic;font-weight:400;font-display:block;src:url('../../fontes/dmserif-italic-400.woff2') format('woff2');}
@font-face{font-family:'DM Serif Display';font-style:normal;font-weight:400;font-display:block;src:url('../../fontes/dmserif-normal-400.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-style:italic;font-weight:400;font-display:block;src:url('../../fontes/dmsans-italic-400.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:300;font-display:block;src:url('../../fontes/dmsans-normal-300.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:400;font-display:block;src:url('../../fontes/dmsans-normal-400.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:500;font-display:block;src:url('../../fontes/dmsans-normal-500.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:600;font-display:block;src:url('../../fontes/dmsans-normal-600.woff2') format('woff2');}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:700;font-display:block;src:url('../../fontes/dmsans-normal-700.woff2') format('woff2');}
@font-face{font-family:'Space Mono';font-style:italic;font-weight:400;font-display:block;src:url('../../fontes/spacemono-italic-400.woff2') format('woff2');}
@font-face{font-family:'Space Mono';font-style:normal;font-weight:400;font-display:block;src:url('../../fontes/spacemono-normal-400.woff2') format('woff2');}
@font-face{font-family:'Space Mono';font-style:normal;font-weight:700;font-display:block;src:url('../../fontes/spacemono-normal-700.woff2') format('woff2');}

@font-face{font-family:'Bodoni Moda';font-style:italic;font-weight:400 900;font-display:block;font-stretch:normal;src:url('../../fontes/bodonimoda-italic-variable.woff2') format('woff2');}
@font-face{font-family:'Bodoni Moda';font-style:normal;font-weight:400 900;font-display:block;font-stretch:normal;src:url('../../fontes/bodonimoda-normal-variable.woff2') format('woff2');}
@font-face{font-family:'Caveat';font-style:normal;font-weight:400 700;font-display:block;src:url('../../fontes/caveat-variable.woff2') format('woff2');}
@font-face{font-family:'Playfair Display';font-style:italic;font-weight:400 700;font-display:block;src:url('../../fontes/playfair-italic-variable.woff2') format('woff2');}

*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html,body{width:1080px;height:1350px;overflow:hidden;background:#000}
body{font-family:'DM Sans',sans-serif}
.tela{position:relative;width:1080px;height:1350px;overflow:hidden}
.foto{position:absolute;inset:0;background-size:cover;background-position:center 18%;
      filter:saturate(1.06) contrast(1.03) brightness(1.02)}
.calor{position:absolute;inset:0;background:rgba(120,72,40,.1);mix-blend-mode:multiply}
.marca{position:absolute;left:0;right:0;z-index:20;text-align:center;
       font-size:15px;letter-spacing:.42em;text-transform:uppercase;font-weight:600;
       color:rgba(255,255,255,.94);text-shadow:0 1px 14px rgba(40,24,12,.6)}
.sombra{text-shadow:0 2px 18px rgba(38,22,12,.55),0 1px 3px rgba(38,22,12,.4)}

    .foto{background-image:url('../../fotos/rhai-bebe.jpg')}
    .veu{position:absolute;inset:0;background:linear-gradient(180deg,rgba(46,28,16,0.24) 0%,rgba(46,28,16,0) 22%,rgba(46,28,16,0) 44%,rgba(40,24,13,0.50) 70%,rgba(34,20,11,0.8) 100%)}
    .marca.topo{top:74px}
    .meio{position:absolute;left:44px;right:44px;bottom:150px;
          z-index:20;text-align:center}
    .serif{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;
           font-size:150px;line-height:.9;
           letter-spacing:-.015em;color:#fff;position:relative;z-index:2}
    /* o encavalamento era -.19em e comia o acento: o agudo do "é" caía
       dentro da barriga branca da serifa de cima e sumia. -.05em mantém o
       efeito e deixa o acento respirar. */
    .sans{font-family:'DM Sans',sans-serif;font-weight:700;margin-top:-.05em;
          font-size:128px;line-height:.92;
          letter-spacing:-.035em;color:#fff;position:relative;z-index:1}
    .sob{margin-top:26px;font-size:21px;letter-spacing:.44em;font-weight:600;
         text-transform:uppercase;color:rgba(255,255,255,.95)}
    .cta{position:absolute;left:0;right:0;bottom:70px;z-index:20;text-align:center;
         font-size:14px;letter-spacing:.42em;text-transform:uppercase;font-weight:600;
         color:rgba(255,255,255,.9)}
    
</style></head><body><div class="tela">
      <div class="foto"></div><div class="calor"></div><div class="veu"></div>
      <div class="marca topo">@rhaicalazans</div>
      <div class="meio">
        <div class="serif sombra">Ocupada</div>
        <div class="sans sombra">não é presente</div><div class="sob sombra">maternidade e trabalho</div>
      </div>
      <div class="cta sombra">leia a legenda</div>
      </div></body></html>
