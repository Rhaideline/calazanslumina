*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html,body{width:1080px;height:1440px;overflow:hidden;background:#17120F}
body{font-family:'Figtree',system-ui,sans-serif}
.tela{position:relative;width:1080px;height:1440px;overflow:hidden}
.foto{position:absolute;inset:0;background-repeat:no-repeat;background-size:cover}

/* a placa: nome centralizado, filete embaixo. Mesma peça em cima e
   embaixo — é o que emoldura a foto e faz o post virar página */
.placa{position:absolute;left:50%;transform:translateX(-50%);z-index:30;
       width:412px;text-align:center}
.placa .nome{font-family:'Figtree',system-ui,sans-serif;font-size:19px;letter-spacing:.3em;
             text-transform:uppercase;color:#fff;white-space:nowrap}
.placa .nome b{font-weight:600}
.placa .nome span{font-weight:300;color:rgba(255,255,255,.72)}
.placa .fio{margin-top:15px;height:1px;background:rgba(255,255,255,.72)}
.placa.topo{top:78px}
.placa.base{bottom:78px}

/* a pilha: entrelinha apertada e tracking negativo, como manda display */
/* campo entre as placas. Tudo que é conteúdo mora aqui, em fluxo — somar
   altura na mão foi como o apoio acabou em cima da última linha da pilha */
.campo{position:absolute;left:52px;right:52px;top:172px;bottom:172px;
       z-index:26;display:flex;flex-direction:column;justify-content:center;
       align-items:center;text-align:center}
.pilha{font-family:'Figtree',system-ui,sans-serif;font-weight:900;color:#fff;
       line-height:.88;letter-spacing:-.025em}
.apoio{margin-top:32px;max-width:760px;font-family:'Figtree',system-ui,sans-serif;font-weight:400;
       font-size:27px;line-height:1.42;color:rgba(255,255,255,.9)}
.sombra{text-shadow:0 3px 28px rgba(14,9,7,.5),0 1px 4px rgba(14,9,7,.34)}

    .fundo{position:absolute;inset:0;background:#17120F}
    .janela{width:560px;height:690px;overflow:hidden;border:1px solid rgba(255,255,255,.72);
            position:relative;flex:0 0 auto}
    .foto{background-image:url('../../fotos/rhai-bebe2.jpg');background-position:center 18%;filter:saturate(1.03) contrast(1.03)}
    .foto{position:absolute;inset:0}
    .campo{justify-content:center}
    .pilha{font-size:88px}

      <div class="fundo"></div><div class="placa topo"><div class="nome"><b>Rhai</b> <span>Calazans</span></div><div class="fio"></div></div><div class="placa base"><div class="nome"><span>n&ordm; 04</span></div><div class="fio"></div></div>
