// ===== RENDER =====
const grid=document.getElementById('postsGrid');
posts.forEach(post=>{
  const w=document.createElement('div');w.className='post-wrapper';
  const isC=post.slides.length>1;
  let h=`<div class="post-label">${post.label}</div><div class="post-type">${post.type}${isC?' ('+post.slides.length+' slides)':''}</div><div class="post-preview" id="preview-${post.id}">`;
  post.slides.forEach((s,i)=>{h+=`<div class="render-area" id="slide-${post.id}-${i}" style="${i>0?'display:none;':''}">${s}</div>`;});
  h+=`</div>`;
  if(isC){
    h+=`<div class="carousel-arrows"><button onclick="prevS(${post.id},${post.slides.length})">&#8592;</button><button onclick="nextS(${post.id},${post.slides.length})">&#8594;</button></div>`;
    h+=`<div class="carousel-nav" id="dots-${post.id}">`;
    post.slides.forEach((_,i)=>{h+=`<button class="carousel-dot${i===0?' active':''}" onclick="goS(${post.id},${i},${post.slides.length})"></button>`;});
    h+=`</div><div class="slide-counter" id="c-${post.id}">1/${post.slides.length}</div>`;
    h+=`<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px;">`;
    post.slides.forEach((_,i)=>{h+=`<button class="btn-dl" onclick="dl(${post.id},${i})">Slide ${i+1}</button>`;});
    h+=`<button class="btn-dl" style="border-color:#fffa;color:#fffc;" onclick="dlAll(${post.id},${post.slides.length})">Todos</button></div>`;
  }else{h+=`<button class="btn-dl" onclick="dl(${post.id},0)">&#11015; Baixar Post</button>`;}
  w.innerHTML=h;grid.appendChild(w);
});

const ss={};posts.forEach(p=>ss[p.id]=0);
function goS(id,i,t){
  document.getElementById(`slide-${id}-${ss[id]}`).style.display='none';
  document.getElementById(`slide-${id}-${i}`).style.display='';
  ss[id]=i;
  const d=document.getElementById(`dots-${id}`);
  if(d)d.querySelectorAll('.carousel-dot').forEach((x,j)=>x.classList.toggle('active',j===i));
  const c=document.getElementById(`c-${id}`);if(c)c.textContent=`${i+1}/${t}`;
}
function nextS(id,t){goS(id,(ss[id]+1)%t,t);}
function prevS(id,t){goS(id,(ss[id]-1+t)%t,t);}

async function dl(id,si){
  const el=document.getElementById(`slide-${id}-${si}`);
  const was=el.style.display==='none';if(was)el.style.display='';
  el.style.transform='none';el.style.position='absolute';el.style.left='-9999px';el.style.top='0';
  document.body.appendChild(el);
  try{
    const c=await html2canvas(el,{width:1080,height:1350,scale:1,useCORS:true,allowTaint:true,backgroundColor:null,logging:false});
    const a=document.createElement('a');
    const sl=posts.find(p=>p.id===id).slides.length>1?`_slide${si+1}`:'';
    a.download=`calazans_post${String(id).padStart(2,'0')}${sl}.png`;a.href=c.toDataURL('image/png');a.click();
  }catch(e){console.error(e);alert('Erro ao gerar. Tente print screen (Win+Shift+S)');}
  const pr=document.getElementById(`preview-${id}`);
  el.style.transform='scale(.25)';el.style.transformOrigin='top left';el.style.position='relative';el.style.left='';el.style.top='';
  pr.appendChild(el);if(was)el.style.display='none';
}
async function dlAll(id,t){for(let i=0;i<t;i++){await dl(id,i);await new Promise(r=>setTimeout(r,500));}}
async function downloadAll(){
  const b=document.querySelector('.btn-all');const ts=posts.reduce((s,p)=>s+p.slides.length,0);let d=0;
  b.textContent=`Gerando... 0/${ts}`;b.disabled=true;
  for(const p of posts){for(let i=0;i<p.slides.length;i++){await dl(p.id,i);d++;b.textContent=`Gerando... ${d}/${ts}`;document.getElementById('progressBar').style.width=`${(d/ts)*100}%`;await new Promise(r=>setTimeout(r,600));}}
  b.textContent='Todos baixados!';b.disabled=false;
  setTimeout(()=>{b.textContent='Baixar Todos os 42 Posts';document.getElementById('progressBar').style.width='0%';},3000);
}
</script>
